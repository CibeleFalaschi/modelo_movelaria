<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movelaria Modelo</title>
</head>
 <link rel="stylesheet" href="css/style.css">
<body>
    <nav class="menu-superior">
    <div class="logo">Movelaria Modelo</div>
    <ul>
        <li><a href="dashboard.html">Início</a></li>
        <li><a href="contato.html">Briefing</a></li>
        <li><a href="orcamento.html">Orçamento</a></li>
        <li><a href="cliente.html">Cliente</a></li>
        <li><a href="index.html" class="btn-sair">Sair</a></li>
    </ul>
</nav>

    <div class="container-lista">
    <h2> Orçamento</h2>
    
    <!-- Barra de busca rápida -->
    <div class="busca">
    <!-- onkeyup="filtrar()" chama a função a cada letra digitada -->
    <input type="text" id="buscaCliente" onkeyup="filtrarClientes()" placeholder="Digite o nome do cliente...">
    </div>


    <table>
        <thead>
            <tr>
                <th>Nº</th>
                <th>Contato</th>
                <th>Data</th>
                <th>Valor Total</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaCorpo">
            <!-- O Python vai preencher estas linhas automaticamente -->
            <tr>
                <td>001</td>
                <td>João Silva</td>
                <td>10/04/2026</td>
                <td>R$ 5.000,00</td>
                <td><span class="badge">Em Aberto</span></td>
                
                <td>
    <!-- Botão de Editar (que já configuramos a função no JS) -->
                <button class="btn-edit" onclick="abrirOrcamento(1)">✏️ Editar / Abrir</button>
    
    <!-- Apenas UM botão de imprimir com a função correta -->
                <button class="btn-print" onclick="window.print()">🖨️ Imprimir</button>
            </td>
            </tr>
        </tbody>
    </table>
</div>

    <script src="js/script.js"></script> 
</body>
</html>
