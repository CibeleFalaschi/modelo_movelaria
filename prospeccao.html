<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospecção - Movelaria Modelo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="menu-superior">
        <div class="logo">Movelaria Modelo</div>
        <ul>
            <li><a href="dashboard.html">Início</a></li>
            <li><a href="prospeccao.html">Prospecção</a></li>
            <li><a href="briefing_orcamento.html">Briefing</a></li>
            <li><a href="orcamento.html">Orçamento</a></li>
            <li><a href="cliente.html">Cliente</a></li>
            <li><a href="index.html" class="btn-sair">Sair</a></li>
        </ul>
    </nav>

    <div class="container-lista">
    <h2>Prospecção</h2>

    <!-- Organizamos o botão e a busca em uma linha -->
    <div class="topo-tabela">
        <button onclick="abrirNovaProspeccao()">+ Nova Prospecção</button>

        <div class="busca-box">
            <label for="inputBusca">Filtrar Nome:</label>
            <input type="text" id="inputBusca" onkeyup="filtrarProspeccoes()" placeholder="Digite para pesquisar...">
        </div>
    </div>

    <table id="tabela-prospeccao">
        <table id="tabela-prospeccao">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Status</th>
                    <th>Vendedor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Maria</td>
                    <td>(19) 99999-9999</td>
                    <td>Em andamento</td>
                    <td>Vendedor A</td>
                    <td>
                        <button onclick="editarProspeccao(this)">✏️</button>
                        <button onclick="abrirHistorico()">📋</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- MODAL PROSPECÇÃO -->
    <div id="overlay">
        <div id="form-prospeccao">
            <h3>Dados da Prospecção</h3>
            <label>Nome</label>
            <input type="text" id="nome">

            <label>Telefone</label>
            <input type="text" id="telefone">

            <label>Status</label>
            <select id="status">
                <option>Em andamento</option>
                <option>Realizar novo contato</option>
                <option>Perdido</option>
                <option>Convertido</option>
            </select>
            <br><br>
            <button onclick="salvarEdicao()">Salvar</button>
            <button onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
